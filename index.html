    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Latar belakang gradient animasi biru dan hijau */
            background: linear-gradient(-45deg, #e0f2fe, #dcfce3, #bae6fd, #bbf7d0);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            background-attachment: fixed;
        }

        /* Animasi untuk latar belakang bergerak */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Keyframes Animasi Masuk */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.9);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Class Utilities Animasi */
        .animate-fade-up {
            opacity: 0;
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .animate-pop {
            opacity: 0;
            animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Pengaturan Waktu Tunda (Delay) Beruntun */
        .delay-0 { animation-delay: 0s; }
        .delay-1 { animation-delay: 0.15s; }
        .delay-2 { animation-delay: 0.25s; }
        .delay-3 { animation-delay: 0.35s; }
        .delay-4 { animation-delay: 0.45s; }
        .delay-5 { animation-delay: 0.55s; }
        .delay-6 { animation-delay: 0.65s; }
        .delay-7 { animation-delay: 0.75s; }
        .delay-8 { animation-delay: 0.85s; }
        .delay-9 { animation-delay: 0.95s; }
        .delay-10 { animation-delay: 1.05s; }
        .delay-11 { animation-delay: 1.15s; }

        /* Animasi Kaca Mengkilap saat diklik */
        .shine-element {
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            /* Gradien putih transparan untuk efek kilap kaca */
            background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.8) 50%, rgba(255, 255, 255, 0) 100%);
            transform: skewX(-25deg);
            animation: shine-sweep 0.6s ease-out forwards;
            pointer-events: none;
        }
        @keyframes shine-sweep {
            0% { left: -150%; }
            100% { left: 150%; }
        }

        /* Utility untuk menyembunyikan view */
        .hidden-view {
            display: none !important;
        }
    </style>

    <script>
        // Logika untuk efek klik mengkilap kaca
        function applyGlassEffect(elements) {
            elements.forEach(button => {
                button.addEventListener('click', function(e) {
                    const existingShine = this.querySelector('.shine-element');
                    if (existingShine) existingShine.remove();

                    const shine = document.createElement('div');
                    shine.classList.add('shine-element');
                    
                    this.appendChild(shine);

                    setTimeout(() => {
                        shine.remove();
                    }, 600);
                });
            });
        }
        
        applyGlassEffect(document.querySelectorAll('.btn-glass'));

        // Logika untuk perpindahan "Halaman"
        const btnOpenSpotify = document.getElementById('btn-open-spotify');
        const btnBack = document.getElementById('btn-back');
        const homeView = document.getElementById('homeView');
        const playlistView = document.getElementById('playlistView');

        // Fungsi untuk mereset animasi agar berjalan lagi saat view dibuka
        function resetAnimations(container) {
            const animatedElements = container.querySelectorAll('.animate-fade-up, .animate-pop');
            animatedElements.forEach(el => {
                el.style.animation = 'none';
                el.offsetHeight; // trigger reflow
                el.style.animation = null; 
            });
        }

        btnOpenSpotify.addEventListener('click', () => {
            // Sembunyikan halaman utama, tampilkan halaman playlist
            homeView.classList.add('hidden-view');
            playlistView.classList.remove('hidden-view');
            resetAnimations(playlistView);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        btnBack.addEventListener('click', () => {
            // Sembunyikan halaman playlist, kembali ke halaman utama
            playlistView.classList.add('hidden-view');
            homeView.classList.remove('hidden-view');
            resetAnimations(homeView);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
