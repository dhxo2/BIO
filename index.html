<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhika Satya | Contact Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Latar belakang gradient animasi biru dan hijau */
            background: linear-gradient(-45deg, #e0f2fe, #dcfce3, #bae6fd, #bbf7d0);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            background-attachment: fixed;
        }

        /* Animasi untuk latar belakang bergerak */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Keyframes Animasi Masuk */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.9);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Class Utilities Animasi */
        .animate-fade-up {
            opacity: 0;
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .animate-pop {
            opacity: 0;
            animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Pengaturan Waktu Tunda (Delay) Beruntun */
        .delay-0 { animation-delay: 0s; }
        .delay-1 { animation-delay: 0.15s; }
        .delay-2 { animation-delay: 0.25s; }
        .delay-3 { animation-delay: 0.35s; }
        .delay-4 { animation-delay: 0.45s; }
        .delay-5 { animation-delay: 0.55s; }
        .delay-6 { animation-delay: 0.65s; }
        .delay-7 { animation-delay: 0.75s; }
        .delay-8 { animation-delay: 0.85s; }
        .delay-9 { animation-delay: 0.95s; }
        .delay-10 { animation-delay: 1.05s; }

        /* Animasi Kaca Mengkilap saat diklik */
        .shine-element {
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            /* Gradien putih transparan untuk efek kilap kaca */
            background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.8) 50%, rgba(255, 255, 255, 0) 100%);
            transform: skewX(-25deg);
            animation: shine-sweep 0.6s ease-out forwards;
            pointer-events: none;
        }
        @keyframes shine-sweep {
            0% { left: -150%; }
            100% { left: 150%; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8">

    <!-- Main Container Card (Bingkai Paling Besar) -->
    <main class="w-full max-w-md bg-white/70 backdrop-blur-xl rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] p-6 sm:p-8 animate-fade-up delay-0">
        
        <!-- Profile Section -->
        <header class="text-center mb-6">
            <div class="relative inline-block animate-pop delay-1">
                <!-- Foto Profil Placeholder -->
                <img src="profile.jpg" 
                     alt="Profile Picture" 
                     class="w-24 h-24 sm:w-28 sm:h-28 rounded-full object-cover mx-auto shadow-lg border-4 border-white/80">
                <!-- Badge Online Indicator -->
                <span class="absolute bottom-1 right-1 sm:bottom-2 sm:right-2 w-4 h-4 bg-green-500 border-2 border-white rounded-full"></span>
            </div>
            
            <h1 class="text-2xl font-bold text-slate-900 mt-4 mb-1 tracking-tight animate-fade-up delay-2">Dhika Satya</h1>
            <p class="text-sm font-medium text-slate-800 mb-2 animate-fade-up delay-2">Informasi Tentang Saya</p>
        </header>

        <!-- Link Buttons Section -->
        <div class="flex flex-col gap-4 mb-8">
            <!-- LinkedIn -->
            <div class="animate-pop delay-3">
                <a href="https://www.linkedin.com/in/dhika-satya-788120377/" target="_blank" class="btn-glass relative overflow-hidden flex items-center px-5 py-4 bg-white/80 hover:bg-white rounded-2xl shadow-sm transition-all duration-200 backdrop-blur-sm transform hover:-translate-y-1 hover:scale-[1.02] hover:shadow-md active:scale-[0.96] active:translate-y-0 active:shadow-[inset_0_4px_6px_rgba(0,0,0,0.15)]">
                    <svg class="w-5 h-5 text-slate-700" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill-rule="evenodd" d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" clip-rule="evenodd" />
                    </svg>
                    <span class="ml-4 font-semibold text-slate-800 text-[15px]">LinkedIn</span>
                </a>
            </div>
            
            <!-- Portofolio -->
            <div class="animate-pop delay-4">
                <a href="https://www.notion.so/Dhika-Satya-Portfolio-30364c41c3a880bfbe79e478780db051?source=copy_link" target="_blank" class="btn-glass relative overflow-hidden flex items-center px-5 py-4 bg-white/80 hover:bg-white rounded-2xl shadow-sm transition-all duration-200 backdrop-blur-sm transform hover:-translate-y-1 hover:scale-[1.02] hover:shadow-md active:scale-[0.96] active:translate-y-0 active:shadow-[inset_0_4px_6px_rgba(0,0,0,0.15)]">
                    <svg class="w-5 h-5 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                    <span class="ml-4 font-semibold text-slate-800 text-[15px]">Portofolio</span>
                </a>
            </div>

            <!-- Lynk.id -->
            <div class="animate-pop delay-5">
                <a href="https://lynk.id/o2.company" target="_blank" class="btn-glass relative overflow-hidden flex items-center px-5 py-4 bg-white/80 hover:bg-white rounded-2xl shadow-sm transition-all duration-200 backdrop-blur-sm transform hover:-translate-y-1 hover:scale-[1.02] hover:shadow-md active:scale-[0.96] active:translate-y-0 active:shadow-[inset_0_4px_6px_rgba(0,0,0,0.15)]">
                    <svg class="w-5 h-5 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                    </svg>
                    <span class="ml-4 font-semibold text-slate-800 text-[15px]">Lynk.id</span>
                </a>
            </div>

            <!-- TeePublic -->
            <div class="animate-pop delay-6">
                <a href="https://tee.pub/lic/dspxo2" target="_blank" class="btn-glass relative overflow-hidden flex items-center px-5 py-4 bg-white/80 hover:bg-white rounded-2xl shadow-sm transition-all duration-200 backdrop-blur-sm transform hover:-translate-y-1 hover:scale-[1.02] hover:shadow-md active:scale-[0.96] active:translate-y-0 active:shadow-[inset_0_4px_6px_rgba(0,0,0,0.15)]">
                    <svg class="w-5 h-5 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                    </svg>
                    <span class="ml-4 font-semibold text-slate-800 text-[15px]">TeePublic</span>
                </a>
            </div>
        </div>

        <!-- Contact Form -->
        <div class="border-t border-white/60 pt-6 text-left">
            <h2 class="text-xl font-bold text-slate-900 text-center mb-6 animate-fade-up delay-7">Send a Message</h2>
            <form action="https://formspree.io/f/mjkajyov" method="POST" class="space-y-5">
                
                <!-- Row for Name and Address -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 animate-fade-up delay-8">
                    <div>
                        <label for="name" class="block text-sm font-semibold text-slate-700 mb-1">Name</label>
                        <input type="text" id="name" name="name" placeholder="Full name" required class="block w-full px-3 py-2 bg-white/60 rounded-md text-sm text-slate-900 shadow-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 transition">
                    </div>
                    <div>
                        <label for="address" class="block text-sm font-semibold text-slate-700 mb-1">Address</label>
                        <input type="text" id="address" name="address" placeholder="Address (optional)" class="block w-full px-3 py-2 bg-white/60 rounded-md text-sm text-slate-900 shadow-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 transition">
                    </div>
                </div>

                <!-- Email Input -->
                <div class="animate-fade-up delay-8">
                    <label for="email" class="block text-sm font-semibold text-slate-700 mb-1">Email</label>
                    <input type="email" id="email" name="_replyto" placeholder="yourname@gmail.com" required autocomplete="email" pattern=".+@gmail\.com" title="Please enter a valid Google email address (@gmail.com)." class="block w-full px-3 py-2 bg-white/60 rounded-md text-sm text-slate-900 shadow-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 transition">
                </div>

                <!-- Message Textarea -->
                <div class="animate-fade-up delay-9">
                    <label for="message" class="block text-sm font-semibold text-slate-700 mb-1">Information</label>
                    <textarea id="message" name="message" rows="4" placeholder="Write your message here..." required class="block w-full px-3 py-2 bg-white/60 rounded-md text-sm text-slate-900 shadow-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 transition"></textarea>
                </div>

                <!-- Submit Button -->
                <div class="text-center pt-2 animate-pop delay-10">
                    <button type="submit" class="btn-glass relative overflow-hidden inline-flex items-center justify-center w-full sm:w-auto px-8 py-3 border border-transparent text-base font-medium rounded-lg shadow-lg text-white bg-sky-500 hover:bg-sky-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500 focus:ring-offset-transparent transition-all duration-200 transform hover:-translate-y-1 hover:shadow-xl active:scale-[0.96] active:translate-y-0 active:shadow-[inset_0_4px_6px_rgba(0,0,0,0.3)]">
                        <svg class="w-5 h-5 mr-2 -ml-1" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
                        Send Message
                    </button>
                </div>
            </form>
        </div>
        
        <!-- Footer -->
        <footer class="mt-8 pt-4 border-t border-gray-200/50 text-center animate-fade-up delay-10">
            <p class="text-xs text-slate-400">&copy; 2026 Dhika Satya. All rights reserved.</p>
        </footer>

    </main>

    <!-- Script untuk memicu animasi kaca saat diklik -->
    <script>
        document.querySelectorAll('.btn-glass').forEach(button => {
            button.addEventListener('click', function(e) {
                const existingShine = this.querySelector('.shine-element');
                if (existingShine) existingShine.remove();

                const shine = document.createElement('div');
                shine.classList.add('shine-element');
                
                this.appendChild(shine);

                setTimeout(() => {
                    shine.remove();
                }, 600);
            });
        });
    </script>

</body>
</html>
